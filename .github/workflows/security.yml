name: Security tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/README.md', 'SECURITY.md', 'results/**']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      kidlat:
        description: Kidlat version to test (blank = pinned)
        default: ''

permissions:
  contents: write

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rm -rf results
      - if: inputs.kidlat != ''
        run: npm install --no-save kidlat@${{ inputs.kidlat }}
      - run: npm run fuzz
        continue-on-error: true
        env:
          FUZZ_SEED: ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-fuzz
          path: results/fuzz.json
      - uses: actions/upload-artifact@v4
        with:
          name: regressions
          path: fuzz/regressions/
          if-no-files-found: ignore

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rm -rf results
      - if: inputs.kidlat != ''
        run: npm install --no-save kidlat@${{ inputs.kidlat }}
      - run: npm run soak
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: results-soak
          path: results/soak.json

  security:
    name: Smuggling (direct + nginx) and testssl.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rm -rf results
      - if: inputs.kidlat != ''
        run: npm install --no-save kidlat@${{ inputs.kidlat }}

      - name: Start nginx in front of :3001
        run: |
          docker run -d --name nginx --network host \
            -v "$PWD/request-smuggling/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
      - name: Smuggling probes through nginx
        run: npm run smuggling:nginx
        continue-on-error: true
      - name: Smuggling probes direct to Kidlat
        run: npm run smuggling
        continue-on-error: true

      # testssl trusts the throwaway root (--add-ca), so the grade reflects Kidlat's TLS config.
      - name: testssl.sh against Kidlat's TLS
        run: |
          mkdir -p build/testssl && chmod 777 build/testssl
          npm run tls:server &
          for i in $(seq 30); do curl -sk -o /dev/null https://127.0.0.1:8443/ && break; sleep 1; done
          docker run --rm --network host -v "$PWD/build/testssl:/out" drwetter/testssl.sh:3.2 \
            --quiet --color 0 --warnings off --add-ca /out/root.pem \
            --jsonfile /out/result.json https://127.0.0.1:8443 || true
          npm run tls:check
        continue-on-error: true

      - name: nginx logs
        if: always()
        run: docker logs nginx
      - uses: actions/upload-artifact@v4
        with:
          name: results-security
          path: results/
      - uses: actions/upload-artifact@v4
        with:
          name: testssl-raw
          path: build/testssl/result.json

  report:
    needs: [fuzz, soak, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: regressions
          path: fuzz/regressions/
        continue-on-error: true

      - name: Update README
        id: readme
        run: node scripts/update-readme.mjs
        continue-on-error: true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md */README.md SECURITY.md results/ fuzz/regressions/
          git diff --cached --quiet || { git commit -m "Update security results [skip ci]"; git push; }

      - if: steps.readme.outcome == 'failure'
        run: echo "::error::One or more security suites failed" && exit 1
