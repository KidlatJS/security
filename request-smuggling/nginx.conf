# Reverse proxy for the nightly smuggling probes: nginx on :8080 → Kidlat on :3001,
# with upstream keep-alive so a desync could poison a reused connection.
worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    upstream kidlat {
        server 127.0.0.1:3001;
        keepalive 8;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://kidlat;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
